<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Noir Language Riddles: The Babel Conspiracy</title>
    <style>
        body {
            background-color: black;
            color: #e0e0e0;
            font-family: "Courier New", monospace;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.7;
        }
        h1 {
            font-size: 28px;
            border-bottom: 2px solid #444;
            padding-bottom: 15px;
            letter-spacing: 1px;
        }
        h2 {
            font-size: 22px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-top: 30px;
        }
        .passage {
            margin-bottom: 25px;
            padding-bottom: 20px;
        }
        a {
            color: #999;
            text-decoration: none;
            border: 1px solid #555;
            padding: 3px 8px;
            margin: 2px;
            font-size: 14px;
            display: inline-block;
        }
        a:hover {
            background-color: #333;
            color: #fff;
        }
        .dialogue {
            font-style: italic;
            color: #bbb;
            margin: 10px 0;
        }
        .clue {
            font-family: "Courier New", monospace;
            background-color: #111;
            padding: 8px 12px;
            border-left: 3px solid #555;
            margin: 10px 0;
            font-size: 16px;
            white-space: pre-wrap;
        }
        .cyrillic {
            font-family: "Courier New", monospace;
            font-size: 18px;
        }
        .location {
            font-weight: bold;
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .wrong {
            color: #e74c3c;
            font-style: italic;
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .correct {
            color: #4CAF50;
        }
        .hint {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        #loading {
            color: #666;
            font-style: italic;
        }
        .nav {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        /* ===== NEW UI ELEMENTS ===== */
        #game-ui {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            border-top: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        #sanity-meter {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sanity-icon {
            color: #e74c3c;
            font-size: 20px;
        }
        .sanity-full { color: #e74c3c; }
        .sanity-low { color: #c0392b; }
        .sanity-critical { color: #922b21; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #inventory {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 50%;
        }
        .item {
            background: #1a1a1a;
            border: 1px solid #555;
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 3px;
            cursor: default;
        }
        .item:hover {
            background: #2a2a2a;
            border-color: #777;
        }
        #inventory-label {
            font-size: 12px;
            color: #888;
            margin-right: 10px;
        }
        .game-over, .ending {
            text-align: center;
            padding: 40px 20px;
        }
        .game-over h1 {
            color: #e74c3c;
        }
        .ending h1 {
            color: #4CAF50;
        }
        .stats {
            background: #111;
            padding: 15px;
            border: 1px solid #444;
            margin: 20px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <!-- Game UI (fixed at bottom) -->
    <div id="game-ui">
        <div id="sanity-meter">
            <span>SANITY: </span>
            <span id="sanity-icons"></span>
            <span id="sanity-text"></span>
        </div>
        <div>
            <span id="inventory-label">INVENTORY:</span>
            <div id="inventory"></div>
        </div>
        <div>
            <span>SCORE: <span id="score">0</span></span>
        </div>
    </div>

    <div id="loading" class="passage">
        <p>Loading case files... <span id="dots"></span></p>
    </div>

    <script>
        // Global state
        let db = null;
        let currentRiddle = null;
        let currentLocation = null;
        let gameState = {
            visitedLocations: [],
            solvedRiddles: [],
            inventory: [],
            sanity: 3,
            score: 0,
            maxSanity: 3
        };

        // Animated dots for loading
        const dots = ['', '.', '..', '...'];
        let dotIndex = 0;
        const dotsElement = document.getElementById('dots');
        
        setInterval(() => {
            dotIndex = (dotIndex + 1) % dots.length;
            dotsElement.textContent = dots[dotIndex];
        }, 500);

        // Update UI
        function updateUI() {
            // Sanity meter
            const sanityIcons = document.getElementById('sanity-icons');
            const sanityText = document.getElementById('sanity-text');
            let icons = '';
            for (let i = 0; i < gameState.maxSanity; i++) {
                if (i < gameState.sanity) {
                    icons += '♥';
                } else {
                    icons += '♡';
                }
            }
            sanityIcons.innerHTML = icons;
            sanityText.textContent = `${gameState.sanity}/${gameState.maxSanity}`;
            
            // Update sanity icon color based on level
            sanityIcons.className = gameState.sanity > 1 ? 'sanity-full' : 
                                       gameState.sanity > 0 ? 'sanity-low' : 'sanity-critical';
            
            // Inventory
            const inventoryEl = document.getElementById('inventory');
            inventoryEl.innerHTML = '';
            gameState.inventory.forEach(item => {
                const itemEl = document.createElement('span');
                itemEl.className = 'item';
                itemEl.textContent = item;
                inventoryEl.appendChild(itemEl);
            });
            
            // Score
            document.getElementById('score').textContent = gameState.score;
            
            // Check for game over
            if (gameState.sanity <= 0) {
                showGameOver();
            }
        }

        // Load the database
        async function loadDB() {
            try {
                const response = await fetch('riddles_db.json');
                if (!response.ok) {
                    throw new Error('Database not found');
                }
                db = await response.json();
                startGame();
            } catch (error) {
                console.error('Error loading database:', error);
                loadFallback();
            }
        }

        function loadFallback() {
            db = {
                riddles: [
                    {
                        id: 1,
                        language: "Greek",
                        text: "In Greek, it's <i>βιβλίο</i>. Where do these live?",
                        clue: "βιβλίο",
                        answer: "Library",
                        wrong_answers: ["University", "Bookstore"],
                        explanation: "From Greek βιβλιον (biblion) = book.",
                        next_location: "Library",
                        item: "Case File",
                        difficulty: 1
                    },
                    {
                        id: 2,
                        language: "German",
                        text: "In German, linguists met where '<em>Kaffee</em>' flows. Where?",
                        clue: "Kaffee fließt",
                        answer: "Café Mozart",
                        wrong_answers: ["The university", "A private club"],
                        explanation: "Kaffee = coffee. Berlin's intellectuals met in cafés.",
                        next_location: "Cafe",
                        item: "Sugar Packet",
                        difficulty: 1
                    },
                    {
                        id: 3,
                        language: "Spanish",
                        text: "In Spanish: '<em>El secreto está en la iglesia</em>'. Where?",
                        clue: "El secreto está en la iglesia",
                        answer: "St. Nicholas Church",
                        wrong_answers: ["The cathedral", "A monastery"],
                        explanation: "Iglesia = church.",
                        next_location: "Church",
                        item: "Prayer Book Page",
                        difficulty: 2
                    },
                    {
                        id: 4,
                        language: "Russian",
                        text: "In Russian: '<span class='cyrillic'>Документы в архиве</span>'. Where?",
                        clue: "Документы в архиве",
                        answer: "University Archive",
                        wrong_answers: ["The library", "A museum"],
                        explanation: "Документы = documents, архиве = archive.",
                        next_location: "Archive",
                        item: "Babel Manuscript",
                        difficulty: 2
                    },
                    {
                        id: 5,
                        language: "Proto-Indo-European",
                        text: "These words share a root: Greek <i>πατήρ</i>, German <i>Vater</i>, English <i>father</i>. What's the PIE root?",
                        clue: "pa-tér, Va-ter, fa-ther",
                        answer: "*pəter",
                        wrong_answers: ["pater", "vater"],
                        explanation: "All descend from Proto-Indo-European *pəter*.",
                        next_location: null,
                        item: "Elena's Final Note",
                        difficulty: 3
                    }
                ],
                locations: [
                    {id: "ClientOffice", name: "Client's Office", description: "The rain taps against your window. Dr. Klaus Weber slides a note across your desk.", first_riddle_id: 1},
                    {id: "Library", name: "Berlin State Library", description: "Old paper and older knowledge. A bookmark falls from a linguistics volume.", riddle_id: 2},
                    {id: "Cafe", name: "Café Mozart", description: "The scent of coffee and secrets. A sugar packet bears a Spanish message.", riddle_id: 3},
                    {id: "Church", name: "St. Nicholas Church", description: "Darkness and incense. A prayer book hides a Cyrillic note.", riddle_id: 4},
                    {id: "Archive", name: "University Archive", description: "Dust and shadows. Elena's manuscript lies open.", riddle_id: 5}
                ],
                characters: [
                    {id: "Weber", name: "Dr. Klaus Weber", dialogue: ["She's dead, detective. And she left you this.", "Elena was obsessed with tracing words back to their roots. Said she'd found something... dangerous.", "This is Greek. Means 'book.' Where would a book be?"]},
                    {id: "Librarian", name: "The Librarian", dialogue: ["That young woman came here often. Always met someone at the café across the street.", "Their notes were full of symbols. Strange pair."]},
                    {id: "Waiter", name: "Café Mozart Waiter", dialogue: ["Ah, the professor. She always sat in the corner.", "They'd talk for hours, switching between languages like it was nothing."]},
                    {id: "Sacristan", name: "Old Sacristan", dialogue: ["That professor... she asked about our oldest texts.", "Said she was looking for a connection between languages. Between God and man, even.", "Some doors shouldn't be opened."]},
                    {id: "Volkov", name: "Dr. Volkov", dialogue: ["Ah. I see you've found it.", "Dr. Volkov, at your service. Though Elena would have said <em>sluzhba</em>.", "Unfortunately, this manuscript belongs to my employers."]}
                ]
            };
            startGame();
        }

        function startGame() {
            document.getElementById('loading').hidden = true;
            gameState = {
                visitedLocations: [],
                solvedRiddles: [],
                inventory: [],
                sanity: 3,
                score: 0,
                maxSanity: 3
            };
            updateUI();
            
            const startLoc = db.locations.find(l => l.id === "ClientOffice");
            if (startLoc) {
                showLocation(startLoc);
            } else {
                showRiddle(db.riddles[0]);
            }
        }

        function showLocation(location) {
            currentLocation = location;
            if (!gameState.visitedLocations.includes(location.id)) {
                gameState.visitedLocations.push(location.id);
            }
            
            let html = `
                <div class="passage">
                    <div class="location">:: ${location.name.toUpperCase()} ::</div>
                    <p>${location.description}</p>
            `;

            // Add character dialogue
            const character = findCharacterForLocation(location.id);
            if (character) {
                html += `<p class="dialogue">"${character.dialogue[0]}"</p>`;
            }

            // Find the riddle for this location
            const riddleId = location.riddle_id || location.first_riddle_id;
            const riddle = db.riddles.find(r => r.id === riddleId);
            
            if (riddle) {
                currentRiddle = riddle;
                html += `
                    <div class="clue">${riddle.clue}</div>
                    <p><em>${riddle.text}</em></p>
                    <p>
                `;
                
                const allAnswers = [riddle.answer, ...riddle.wrong_answers];
                const shuffled = shuffleArray(allAnswers);
                
                shuffled.forEach(ans => {
                    html += `<a href="#" onclick="checkAnswer('${ans.replace(/'/g, "\\'")}'); return false;">${ans}</a> `;
                });
                
                html += `
                    </p>
                    <div id="hint-container" style="display:none;">
                        <p class="hint">Hint: ${riddle.hint || 'Think carefully...'}</p>
                        <a href="#" onclick="showHint(); return false;" id="show-hint-btn">Show hint</a>
                    </div>
                `;
            }
            
            html += `</div>`;
            
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
        }

        function showRiddle(riddle) {
            currentRiddle = riddle;
            
            let html = `
                <div class="passage">
                    <h2>Riddle: ${riddle.language}</h2>
                    <div class="clue">${riddle.clue}</div>
                    <p><em>${riddle.text}</em></p>
                    <p>
            `;
            
            const allAnswers = [riddle.answer, ...riddle.wrong_answers];
            const shuffled = shuffleArray(allAnswers);
            
            shuffled.forEach(ans => {
                html += `<a href="#" onclick="checkAnswer('${ans.replace(/'/g, "\\'")}'); return false;">${ans}</a> `;
            });
            
            html += `
                    </p>
                    <div id="hint-container" style="display:none;">
                        <p class="hint">Hint: ${riddle.hint || 'Think carefully...'}</p>
                    </div>
                </div>
            `;
            
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
        }

        function checkAnswer(selected) {
            const correct = selected === currentRiddle.answer;
            
            // Remove all passage content except the current one
            const passages = document.querySelectorAll('.passage');
            passages.forEach((p, index) => {
                if (index < passages.length - 1) {
                    p.remove();
                }
            });
            
            const lastPassage = document.querySelector('.passage');
            
            if (correct) {
                gameState.solvedRiddles.push(currentRiddle.id);
                gameState.score += currentRiddle.difficulty * 10;
                
                // Add item to inventory if it exists
                if (currentRiddle.item && !gameState.inventory.includes(currentRiddle.item)) {
                    gameState.inventory.push(currentRiddle.item);
                }
                
                updateUI();
                
                let html = `
                    <p class="correct">✓ Correct!</p>
                    <p><strong>${currentRiddle.answer}</strong></p>
                    <p>${currentRiddle.explanation}</p>
                `;
                
                // Show collected item
                if (currentRiddle.item) {
                    html += `<p class="correct">You collected: <strong>${currentRiddle.item}</strong></p>`;
                }
                
                // Show related words
                if (currentRiddle.related_words) {
                    html += '<p><small>Related words: ';
                    const langs = Object.keys(currentRiddle.related_words);
                    html += langs.map(l => `${l}: ${currentRiddle.related_words[l]}`).join(', ');
                    html += '</small></p>';
                }
                
                // Progress to next location
                if (currentRiddle.next_location) {
                    const nextLoc = db.locations.find(l => l.id === currentRiddle.next_location);
                    if (nextLoc) {
                        html += `<p><a href="#" onclick="showLocation(db.locations.find(l => l.id === '${currentRiddle.next_location}')); return false;">Continue to ${nextLoc.name}</a></p>`;
                    } else {
                        html += `<p><a href="#" onclick="showRandomRiddle(); return false;">Continue investigating</a></p>`;
                    }
                } else {
                    html += `<p><a href="#" onclick="showRandomRiddle(); return false;">Next riddle</a></p>`;
                }
                
                lastPassage.innerHTML += html;
            } else {
                gameState.sanity -= 1;
                updateUI();
                
                let html = `
                    <p class="wrong">✗ Wrong.</p>
                    <p><em>${selected}</em> is not the answer.</p>
                    <p><strong>You lose 1 Sanity point!</strong></p>
                    <p>
                        <a href="#" onclick="retryRiddle(); return false;">Try again</a>
                        <a href="#" onclick="showHint(); return false;" id="show-hint-btn">Show hint</a>
                    </p>
                `;
                lastPassage.innerHTML += html;
            }
        }

        function retryRiddle() {
            const passages = document.querySelectorAll('.passage');
            passages.forEach(p => p.remove());
            if (currentLocation) {
                showLocation(currentLocation);
            } else {
                showRiddle(currentRiddle);
            }
        }

        function showHint() {
            const hintContainer = document.getElementById('hint-container');
            if (hintContainer) {
                hintContainer.style.display = 'block';
            }
            const btn = document.getElementById('show-hint-btn');
            if (btn) btn.remove();
        }

        function showRandomRiddle() {
            const unsolved = db.riddles.filter(r => !gameState.solvedRiddles.includes(r.id));
            if (unsolved.length > 0) {
                const randomRiddle = unsolved[Math.floor(Math.random() * unsolved.length)];
                const passages = document.querySelectorAll('.passage');
                passages.forEach(p => p.remove());
                showRiddle(randomRiddle);
            } else {
                showEnding();
            }
        }

        function showGameOver() {
            const passages = document.querySelectorAll('.passage');
            passages.forEach(p => p.remove());
            
            const html = `
                <div class="passage game-over">
                    <h1>GAME OVER</h1>
                    <p>Volkov's men found you first.</p>
                    <div class="stats">
                        <p><strong>Riddles solved:</strong> ${gameState.solvedRiddles.length} of ${db.riddles.length}</p>
                        <p><strong>Items collected:</strong> ${gameState.inventory.length}</p>
                        <p><strong>Final score:</strong> ${gameState.score}</p>
                    </div>
                    <p>The Babel Society wins. For now.</p>
                    <p class="nav"><a href="#" onclick="restartGame(); return false;">Retry Case</a></p>
                </div>
            `;
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
        }

        function showEnding() {
            const passages = document.querySelectorAll('.passage');
            passages.forEach(p => p.remove());
            
            // Determine which ending
            const allRiddlesSolved = gameState.solvedRiddles.length >= db.riddles.length;
            const allItemsCollected = gameState.inventory.length >= db.riddles.filter(r => r.item).length;
            const highScore = gameState.score >= 100;
            
            let endingType = 'bad';
            let title = 'Case Closed';
            let description = 'You solved the case, but Volkov escaped with the manuscript.';
            
            if (allRiddlesSolved && allItemsCollected) {
                endingType = 'perfect';
                title = 'The Truth Revealed';
                description = 'With all clues and the complete Babel Manuscript, you expose the Babel Society to the world. The linguistic conspiracy is finished.';
            } else if (allRiddlesSolved || highScore) {
                endingType = 'good';
                title = 'Partial Victory';
                description = 'You solve the case and recover the manuscript, but Volkov escapes. The Babel Society still lurks in the shadows...';
            } else if (gameState.solvedRiddles.length >= db.riddles.length / 2) {
                endingType = 'okay';
                title = 'A Lead, Not a Victory';
                description = 'You gather enough evidence to close Elena\'s case, but the Babel Society remains at large. At least you tried.';
            }
            
            const html = `
                <div class="passage ending">
                    <h1>${title}</h1>
                    <p>${description}</p>
                    <div class="stats">
                        <p><strong>Riddles solved:</strong> ${gameState.solvedRiddles.length} of ${db.riddles.length}</p>
                        <p><strong>Items collected:</strong> ${gameState.inventory.length} of ${db.riddles.filter(r => r.item).length}</p>
                        <p><strong>Sanity remaining:</strong> ${gameState.sanity}</p>
                        <p><strong>Final score:</strong> ${gameState.score}</p>
                    </div>
                    <p><em>All our words are connected.</em></p>
                    <p class="nav"><a href="#" onclick="restartGame(); return false;">New Case</a></p>
                </div>
            `;
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
        }

        function restartGame() {
            const passages = document.querySelectorAll('.passage');
            passages.forEach(p => p.remove());
            
            document.getElementById('loading').hidden = false;
            document.getElementById('loading').innerHTML = '<p>Restarting case... <span id="dots"></span></p>';
            loadDB();
        }

        function findCharacterForLocation(locId) {
            const locationMap = {
                "ClientOffice": "Weber",
                "Library": "Librarian",
                "Cafe": "Waiter",
                "Church": "Sacristan",
                "Archive": "Volkov"
            };
            const charId = locationMap[locId];
            return db.characters.find(c => c.id === charId);
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // Load the database when the page loads
        loadDB();
    </script>
</body>
</html>
