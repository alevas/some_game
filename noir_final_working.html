<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noir Language Riddles: The Babel Conspiracy</title>
    <style>
        body {
            background-color: black;
            color: #e0e0e0;
            font-family: "Courier New", monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
            line-height: 1.7;
        }
        @media (min-width: 768px) {
            body { padding: 20px; }
        }
        h1 {
            font-size: 24px;
            border-bottom: 2px solid #444;
            padding-bottom: 15px;
            letter-spacing: 1px;
        }
        @media (min-width: 768px) {
            h1 { font-size: 28px; }
        }
        h2 {
            font-size: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-top: 30px;
        }
        @media (min-width: 768px) {
            h2 { font-size: 22px; }
        }
        .passage {
            margin-bottom: 20px;
            padding-bottom: 15px;
        }
        a {
            color: #999;
            text-decoration: none;
            border: 1px solid #555;
            padding: 5px 10px;
            margin: 2px;
            font-size: 14px;
            display: inline-block;
            min-width: 44px;
            min-height: 44px;
            line-height: 34px;
            text-align: center;
        }
        @media (min-width: 768px) {
            a {
                padding: 3px 8px;
                font-size: 14px;
                min-width: 0;
                min-height: 0;
                line-height: normal;
            }
        }
        a:hover {
            background-color: #333;
            color: #fff;
        }
        .dialogue {
            font-style: italic;
            color: #bbb;
            margin: 10px 0;
        }
        .clue {
            font-family: "Courier New", monospace;
            background-color: #111;
            padding: 8px 12px;
            border-left: 3px solid #555;
            margin: 10px 0;
            font-size: 16px;
            white-space: pre-wrap;
        }
        .location {
            font-weight: bold;
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .wrong {
            color: #e74c3c;
            font-style: italic;
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .correct {
            color: #4CAF50;
        }
        .hint {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        #loading {
            color: #666;
            font-style: italic;
        }
        .nav {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        #game-ui {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 10px;
            border-top: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            z-index: 100;
        }
        @media (min-width: 768px) {
            #game-ui { padding: 15px 20px; }
        }
        #sanity-meter {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        @media (min-width: 768px) {
            #sanity-meter { gap: 10px; margin-bottom: 0; }
        }
        .sanity-full { color: #e74c3c; }
        .sanity-low { color: #c0392b; }
        .sanity-critical { color: #922b21; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #inventory {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-width: 60%;
            order: 3;
            width: 100%;
        }
        @media (min-width: 768px) {
            #inventory { max-width: 50%; order: 2; }
        }
        .item {
            background: #1a1a1a;
            border: 1px solid #555;
            padding: 2px 6px;
            font-size: 12px;
            border-radius: 3px;
            cursor: default;
        }
        .item:hover {
            background: #2a2a2a;
            border-color: #777;
        }
        #inventory-label {
            font-size: 12px;
            color: #888;
            margin-right: 10px;
        }
        .game-over, .ending {
            text-align: center;
            padding: 30px 15px;
        }
        @media (min-width: 768px) {
            .game-over, .ending { padding: 40px 20px; }
        }
        .game-over h1 { color: #e74c3c; }
        .ending h1 { color: #4CAF50; }
        .stats {
            background: #111;
            padding: 15px;
            border: 1px solid #444;
            margin: 20px 0;
            text-align: left;
        }
        #save-menu {
            background: rgba(0,0,0,0.95);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 200;
            display: none;
            padding: 20px;
        }
        #save-menu.visible {
            display: block;
        }
        .save-slot {
            background: #111;
            border: 1px solid #444;
            padding: 10px;
            margin: 10px 0;
        }
        .save-slot button {
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Save Menu -->
    <div id="save-menu">
        <h2>Save/Load Game</h2>
        <div class="save-slot" id="slot1">
            <strong>Slot 1</strong>
            <div id="slot1-info">Empty</div>
            <button onclick="saveToSlot(1)">Save</button>
            <button onclick="loadFromSlot(1)">Load</button>
        </div>
        <div class="save-slot" id="slot2">
            <strong>Slot 2</strong>
            <div id="slot2-info">Empty</div>
            <button onclick="saveToSlot(2)">Save</button>
            <button onclick="loadFromSlot(2)">Load</button>
        </div>
        <div class="save-slot" id="slot3">
            <strong>Slot 3</strong>
            <div id="slot3-info">Empty</div>
            <button onclick="saveToSlot(3)">Save</button>
            <button onclick="loadFromSlot(3)">Load</button>
        </div>
        <button onclick="toggleSaveMenu()" style="margin-top: 20px;">Close</button>
    </div>

    <!-- Game UI -->
    <div id="game-ui">
        <div id="sanity-meter">
            <span>SANITY: </span>
            <span id="sanity-icons"></span>
        </div>
        <div id="score-display">SCORE: <span id="score">0</span></div>
        <div>
            <span id="inventory-label">INVENTORY:</span>
            <div id="inventory"></div>
        </div>
        <div>
            <button onclick="toggleSaveMenu()" style="background: #333; color: #ccc; border: 1px solid #555; padding: 3px 8px; cursor: pointer;">Menu</button>
        </div>
    </div>

    <div id="loading" class="passage">
        <p>Loading case files... <span id="dots"></span></p>
    </div>

    <script>
        // ============================================================
        // DATABASE - All data embedded for offline use
        // ============================================================
        const GAME_DB = {
            riddles: [
                {
                    id: 1,
                    language: "Greek",
                    category: "location",
                    text: "In Greek, it is βιβλίο (vivlio). Where do these live?",
                    clue: "βιβλίο",
                    answer: "Library",
                    wrong_answers: ["University", "Bookstore", "Her apartment"],
                    hint: "Think where books are collected and borrowed.",
                    explanation: "From Greek βιβλιον (biblion) = book. The word library comes from Latin liber (book).",
                    next_location: "Library",
                    item: "Case File",
                    difficulty: 1
                },
                {
                    id: 2,
                    language: "German",
                    category: "location",
                    text: "In German, linguists met where Kaffee flows. Where?",
                    clue: "Linguisten trafen sich, wo Kaffee fließt",
                    answer: "Café Mozart",
                    wrong_answers: ["The university", "A private club", "A beer hall"],
                    hint: "Not a pub. Somewhere with coffee.",
                    explanation: "Kaffee = coffee. Berlin intellectuals historically met in cafes.",
                    next_location: "Cafe",
                    item: "Sugar Packet with Clue",
                    difficulty: 1
                },
                {
                    id: 3,
                    language: "Spanish",
                    category: "etymology",
                    text: "This word is libro in Spanish, livre in French, and Buch in German. What is it in English?",
                    clue: "Spanish: libro | French: livre | German: Buch",
                    answer: "Book",
                    wrong_answers: ["Library", "Reading", "Novel"],
                    hint: "All three words mean the same thing. Think: what do you read?",
                    explanation: "All descend from Latin liber (inner bark of trees used for writing). Originally referred to the material, not the object.",
                    next_location: "Cafe",
                    item: "Spanish Dictionary",
                    difficulty: 1
                },
                {
                    id: 4,
                    language: "Russian",
                    category: "etymology",
                    text: "This Slavic word is передача (peredacha) meaning transmission. What English word shares the Latin root 'trahere'?",
                    clue: "передача (peredacha)",
                    answer: "Tradition",
                    wrong_answers: ["Transfer", "Translation", "Transport"],
                    hint: "Think of passing down through generations.",
                    explanation: "From Latin tradere = to hand over. Russian передача comes from the same PIE root *dʰeh₁- (to put, do).",
                    next_location: "Archive",
                    item: "Cipher Wheel",
                    difficulty: 2
                },
                {
                    id: 5,
                    language: "Arvanitika",
                    category: "false friends",
                    text: "In Arvanitika, it is buke. In Greek, it is ψωμί (psomi). What is it in English?",
                    clue: "Arvanitika: buke | Greek: ψωμί",
                    answer: "Bread",
                    wrong_answers: ["Book", "Brick", "Water"],
                    hint: "It is a staple food.",
                    explanation: "Arvanitika buke and Greek ψωμί both mean bread. Shows the Albanian-Greek linguistic connection in Arvanitika.",
                    next_location: "Cafe",
                    item: "Arvanitika Notes",
                    difficulty: 2
                },
                {
                    id: 6,
                    language: "Greek",
                    category: "etymology",
                    text: "In Greek, it is πατήρ (pater). In German, it is Vater. What is it in English?",
                    clue: "Greek: πατήρ | German: Vater",
                    answer: "Father",
                    wrong_answers: ["Mother", "Brother", "Son"],
                    hint: "PIE root: *pəter",
                    explanation: "All descend from Proto-Indo-European *pəter. Shows the ancient connection between Greek and Germanic languages.",
                    next_location: "Church",
                    item: null,
                    difficulty: 1
                },
                {
                    id: 7,
                    language: "German",
                    category: "false friends",
                    text: "In German, Gift does not mean a present. What does it mean?",
                    clue: "German: Gift",
                    answer: "Poison",
                    wrong_answers: ["Gift", "Present", "Disease"],
                    hint: "In English, a gift is positive. Not so in German.",
                    explanation: "German Gift = poison. English gift comes from Old Norse, meaning present. A classic false friend.",
                    next_location: "Cafe",
                    item: null,
                    difficulty: 1
                },
                {
                    id: 8,
                    language: "English",
                    category: "cognates",
                    text: "This English word is mother in English, Mutter in German, and μητέρα (meter) in Greek. What is it?",
                    clue: "English: mother | German: Mutter | Greek: μητέρα",
                    answer: "Mother",
                    wrong_answers: ["Sister", "Aunt", "Wife"],
                    hint: "PIE root: *méh₂tēr",
                    explanation: "All from PIE *méh₂tēr. Shows how basic kinship terms are preserved across 4000+ years.",
                    next_location: "Church",
                    item: "Family Tree",
                    difficulty: 1
                },
                {
                    id: 9,
                    language: "Spanish",
                    category: "etymology",
                    text: "This word is noche in Spanish. In Latin it was nox. What is it in English?",
                    clue: "Spanish: noche | Latin: nox",
                    answer: "Night",
                    wrong_answers: ["Noon", "Noxious", "Nought"],
                    hint: "It is the opposite of day.",
                    explanation: "From Latin nox/noctis. English night also comes from the same PIE root *nókʷts.",
                    next_location: "Library",
                    item: null,
                    difficulty: 1
                },
                {
                    id: 10,
                    language: "Russian",
                    category: "etymology",
                    text: "This Russian word is водка (vodka). It comes from вода (voda) meaning water. What is the connection?",
                    clue: "водка (vodka) | вода (voda)",
                    answer: "Little water",
                    wrong_answers: ["Fire water", "Strong drink", "Russian tea"],
                    hint: "Vodka is a diminutive form.",
                    explanation: "Vodka (водка) is the diminutive of вода (water, voda). Originally referred to distilled spirits.",
                    next_location: "Cafe",
                    item: "Vodka Bottle",
                    difficulty: 2
                }
            ],
            locations: [
                {
                    id: "ClientOffice",
                    name: "Weber's Private Office",
                    description: "The dim glow of a desk lamp illuminates stacks of case files. Berlin, 1947. A typewriter sits silent, waiting. On the desk, a note in Greek catches your eye. Elena Weber, a linguist, has disappeared. The only clue: a trail of etymological breadcrumbs.",
                    first_riddle: 1
                },
                {
                    id: "Library",
                    name: "Staatsbibliothek",
                    description: "Tall shelves stretch into shadow. Ancient manuscripts in Greek, German, Latin. The air smells of parchment and secrets. A librarian eyes you suspiciously from behind a desk piled with indices.",
                    first_riddle: 3
                },
                {
                    id: "Cafe",
                    name: "Café Mozart",
                    description: "The scent of strong coffee and sugar hangs in the air. Intellectuals and spies share tables in the dim light. A waiter polishes a glass, watching. This is where linguists used to meet.",
                    first_riddle: 2
                },
                {
                    id: "Church",
                    name: "St. Nicholas Church",
                    description: "Candlelight flickers against stone walls. The sacristan moves silently between shadows. Old texts in Greek and Latin line the shelves. The Babel Society has left its mark here.",
                    first_riddle: 6
                },
                {
                    id: "Archive",
                    name: "Secret Archive",
                    description: "Files upon files of linguistic research. The Babel Society's true work is here. Volkov, their leader, has been one step ahead. But you're closing in. The final pieces are within reach.",
                    first_riddle: 4
                }
            ],
            characters: [
                { id: "Weber", name: "Elena Weber", dialogue: ["I need your help, detective. The Babel Society is real, and they've got something dangerous."] },
                { id: "Librarian", name: "Herr Schmidt", dialogue: ["She was here just last week. Asking about Proto-Indo-European again."] },
                { id: "Waiter", name: "Karl", dialogue: ["The men in dark suits come in every Tuesday. Always order the same thing."] },
                { id: "Sacristan", name: "Father Thomas", dialogue: ["The church has secrets, detective. Some older than the building itself."] },
                { id: "Volkov", name: "Igor Volkov", dialogue: ["You're too late. The work is already done."] }
            ],
            locationCharacterMap: {
                "ClientOffice": "Weber",
                "Library": "Librarian",
                "Cafe": "Waiter",
                "Church": "Sacristan",
                "Archive": "Volkov"
            }
        };

        // ============================================================
        // GAME STATE
        // ============================================================
        let gameState = {
            visitedLocations: [],
            solvedRiddles: [],
            inventory: [],
            sanity: 3,
            maxSanity: 3,
            score: 0,
            currentLocationId: null,
            currentRiddleId: null
        };

        let currentRiddle = null;
        let currentLocation = null;

        // ============================================================
        // INITIALIZATION
        // ============================================================
        function initGame() {
            // Hide loading
            document.getElementById('loading').hidden = true;
            
            // If we have a saved location, go there. Otherwise start at office.
            if (gameState.currentLocationId) {
                const loc = GAME_DB.locations.find(l => l.id === gameState.currentLocationId);
                if (loc) {
                    showLocation(loc);
                    return;
                }
            }
            
            // Start fresh
            const startLoc = GAME_DB.locations.find(l => l.id === "ClientOffice");
            if (startLoc) {
                gameState.currentLocationId = startLoc.id;
                showLocation(startLoc);
            }
        }

        function loadGame() {
            const saved = localStorage.getItem('babelConspiracyAutoSave');
            if (saved) {
                try {
                    const savedState = JSON.parse(saved);
                    gameState = { ...gameState, ...savedState };
                    console.log('Loaded game state:', gameState);
                } catch (e) {
                    console.error('Error loading save:', e);
                }
            }
            updateSaveSlots();
            initGame();
        }

        // Load on startup
        loadGame();

        // ============================================================
        // SAVE/LOAD SYSTEM
        // ============================================================
        function toggleSaveMenu() {
            const menu = document.getElementById('save-menu');
            menu.classList.toggle('visible');
            updateSaveSlots();
        }

        function saveToSlot(slotNum) {
            localStorage.setItem(`babelConspiracySave${slotNum}`, JSON.stringify(gameState));
            localStorage.setItem('babelConspiracyAutoSave', JSON.stringify(gameState));
            updateSaveSlots();
            toggleSaveMenu();
        }

        function loadFromSlot(slotNum) {
            const saved = localStorage.getItem(`babelConspiracySave${slotNum}`);
            if (saved) {
                try {
                    gameState = JSON.parse(saved);
                    // Clear the screen and restart
                    clearScreen();
                    initGame();
                    toggleSaveMenu();
                } catch (e) {
                    console.error('Error loading save:', e);
                }
            }
        }

        function updateSaveSlots() {
            for (let i = 1; i <= 3; i++) {
                const saved = localStorage.getItem(`babelConspiracySave${i}`);
                const infoEl = document.getElementById(`slot${i}-info`);
                if (saved) {
                    try {
                        const state = JSON.parse(saved);
                        infoEl.textContent = `Score: ${state.score}, Sanity: ${state.sanity}, Riddles: ${state.solvedRiddles.length}`;
                    } catch (e) {
                        infoEl.textContent = 'Corrupted';
                    }
                } else {
                    infoEl.textContent = 'Empty';
                }
            }
        }

        // ============================================================
        // UI UPDATES
        // ============================================================
        function updateUI() {
            // Save current state to localStorage
            localStorage.setItem('babelConspiracyAutoSave', JSON.stringify(gameState));
            
            // Sanity meter
            const sanityIcons = document.getElementById('sanity-icons');
            if (sanityIcons) {
                let icons = '';
                for (let i = 0; i < gameState.maxSanity; i++) {
                    icons += (i < gameState.sanity) ? '♥' : '♡';
                }
                sanityIcons.innerHTML = icons;
                sanityIcons.className = gameState.sanity > 1 ? 'sanity-full' : 
                                       gameState.sanity > 0 ? 'sanity-low' : 'sanity-critical';
            }
            
            // Score
            const scoreEl = document.getElementById('score');
            if (scoreEl) scoreEl.textContent = gameState.score;
            
            // Inventory
            const inventoryEl = document.getElementById('inventory');
            if (inventoryEl) {
                inventoryEl.innerHTML = '';
                gameState.inventory.forEach(item => {
                    const itemEl = document.createElement('span');
                    itemEl.className = 'item';
                    itemEl.textContent = item;
                    inventoryEl.appendChild(itemEl);
                });
            }
            
            // Check for game over
            if (gameState.sanity <= 0) {
                showGameOver();
            }
        }

        function clearScreen() {
            const passages = document.querySelectorAll('.passage');
            passages.forEach(p => p.remove());
        }

        // ============================================================
        // LOCATIONS AND RIDDLES
        // ============================================================
        function showLocation(location) {
            currentLocation = location;
            gameState.currentLocationId = location.id;
            
            if (!gameState.visitedLocations.includes(location.id)) {
                gameState.visitedLocations.push(location.id);
            }
            
            // Find an unsolved riddle for this location
            const locRiddleIds = GAME_DB.riddles
                .filter(r => r.next_location === location.id || r.id === location.first_riddle)
                .map(r => r.id);
            
            const unsolvedRiddle = GAME_DB.riddles.find(r => 
                locRiddleIds.includes(r.id) && !gameState.solvedRiddles.includes(r.id)
            );
            
            let html = `
                <div class="passage">
                    <div class="location">:: ${location.name.toUpperCase()} ::</div>
                    <p>${location.description}</p>
            `;

            // Add character dialogue
            const charId = GAME_DB.locationCharacterMap[location.id];
            const character = GAME_DB.characters.find(c => c.id === charId);
            if (character) {
                html += `<p class="dialogue">"${character.dialogue[0]}"</p>`;
            }

            if (unsolvedRiddle) {
                currentRiddle = unsolvedRiddle;
                gameState.currentRiddleId = unsolvedRiddle.id;
                html += renderRiddle(unsolvedRiddle);
            } else {
                // No more riddles here - offer to go somewhere else or random
                html += `<p>You've solved all the riddles here.</p>`;
                html += `<p><a href="#" onclick="showRandomUnsolvedRiddle(); return false;">Look for more clues</a></p>`;
            }
            
            html += `</div>`;
            
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
            updateUI();
        }

        function renderRiddle(riddle) {
            const allAnswers = [riddle.answer, ...riddle.wrong_answers];
            const shuffled = shuffleArray(allAnswers);
            
            let html = `
                <div class="clue">${riddle.clue}</div>
                <p><em>${riddle.text}</em></p>
                <p>
            `;
            
            shuffled.forEach(ans => {
                const escaped = ans.replace(/'/g, "&#39;");
                html += `<a href="#" onclick="checkAnswer('${escaped}'); return false;">${ans}</a> `;
            });
            
            html += `
                </p>
                <div id="hint-container" style="display:none;">
                    <p class="hint">Hint: ${riddle.hint || 'Think carefully...'}</p>
                </div>
            `;
            
            return html;
        }

        function showRandomUnsolvedRiddle() {
            clearScreen();
            const unsolved = GAME_DB.riddles.filter(r => !gameState.solvedRiddles.includes(r.id));
            if (unsolved.length > 0) {
                const randomRiddle = unsolved[Math.floor(Math.random() * unsolved.length)];
                showRiddle(randomRiddle);
            } else {
                showEnding();
            }
        }

        function showRiddle(riddle) {
            currentRiddle = riddle;
            gameState.currentRiddleId = riddle.id;
            
            let html = `
                <div class="passage">
                    <h2>Riddle: ${riddle.language}</h2>
                    ${renderRiddle(riddle)}
                </div>
            `;
            
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
            updateUI();
        }

        // ============================================================
        // ANSWER CHECKING
        // ============================================================
        function checkAnswer(selected) {
            const correct = selected === currentRiddle.answer;
            
            const lastPassage = document.querySelector('.passage');
            if (!lastPassage) return;
            
            if (correct) {
                // Mark as solved
                if (!gameState.solvedRiddles.includes(currentRiddle.id)) {
                    gameState.solvedRiddles.push(currentRiddle.id);
                }
                gameState.score += currentRiddle.difficulty * 10;
                
                // Add item to inventory
                if (currentRiddle.item && !gameState.inventory.includes(currentRiddle.item)) {
                    gameState.inventory.push(currentRiddle.item);
                }
                
                updateUI();
                
                let html = `
                    <p class="correct">✓ Correct!</p>
                    <p><strong>${currentRiddle.answer}</strong></p>
                    <p>${currentRiddle.explanation}</p>
                `;
                
                if (currentRiddle.item) {
                    html += `<p class="correct">You collected: <strong>${currentRiddle.item}</strong></p>`;
                }
                
                // Progress to next location or random riddle
                if (currentRiddle.next_location) {
                    const nextLoc = GAME_DB.locations.find(l => l.id === currentRiddle.next_location);
                    if (nextLoc) {
                        html += `<p><a href="#" onclick="navigateTo('${currentRiddle.next_location}'); return false;" class="nav-link">Continue to ${nextLoc.name}</a></p>`;
                    } else {
                        html += `<p><a href="#" onclick="showRandomUnsolvedRiddle(); return false;">Continue investigating</a></p>`;
                    }
                } else {
                    html += `<p><a href="#" onclick="showRandomUnsolvedRiddle(); return false;">Next riddle</a></p>`;
                }
                
                lastPassage.innerHTML += html;
            } else {
                gameState.sanity -= 1;
                updateUI();
                
                let html = `
                    <p class="wrong">✗ Wrong.</p>
                    <p><em>${selected}</em> is not the answer.</p>
                    <p><strong>You lose 1 Sanity point!</strong></p>
                    <p>
                        <a href="#" onclick="retryCurrentRiddle(); return false;">Try again</a>
                        <a href="#" onclick="showHint(); return false;" id="show-hint-btn">Show hint</a>
                    </p>
                `;
                lastPassage.innerHTML += html;
            }
        }

        function navigateTo(locationId) {
            clearScreen();
            const loc = GAME_DB.locations.find(l => l.id === locationId);
            if (loc) {
                showLocation(loc);
            } else {
                showRandomUnsolvedRiddle();
            }
        }

        function retryCurrentRiddle() {
            clearScreen();
            if (currentLocation) {
                showLocation(currentLocation);
            } else if (currentRiddle) {
                showRiddle(currentRiddle);
            }
        }

        function showHint() {
            const hintContainer = document.getElementById('hint-container');
            if (hintContainer) {
                hintContainer.style.display = 'block';
            }
            const btn = document.getElementById('show-hint-btn');
            if (btn) btn.remove();
        }

        // ============================================================
        // ENDINGS
        // ============================================================
        function showGameOver() {
            clearScreen();
            
            const html = `
                <div class="passage game-over">
                    <h1>GAME OVER</h1>
                    <p>Volkov's men found you first.</p>
                    <div class="stats">
                        <p><strong>Riddles solved:</strong> ${gameState.solvedRiddles.length} of ${GAME_DB.riddles.length}</p>
                        <p><strong>Items collected:</strong> ${gameState.inventory.length}</p>
                        <p><strong>Final score:</strong> ${gameState.score}</p>
                    </div>
                    <p>The Babel Society wins. For now.</p>
                    <p class="nav"><a href="#" onclick="resetGame(); return false;">Retry Case</a></p>
                </div>
            `;
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
        }

        function showEnding() {
            clearScreen();
            
            const totalRiddles = GAME_DB.riddles.length;
            const riddlesSolved = gameState.solvedRiddles.length;
            const itemsCollected = gameState.inventory.length;
            const allItems = GAME_DB.riddles.filter(r => r.item).length;
            const highScore = gameState.score >= 200;
            
            let title, description;
            
            if (riddlesSolved >= totalRiddles && itemsCollected >= allItems) {
                title = 'The Truth Revealed';
                description = 'With all clues and the complete Babel Manuscript, you expose the Babel Society to the world.';
            } else if (riddlesSolved >= totalRiddles || highScore) {
                title = 'Partial Victory';
                description = 'You solve the case and recover the manuscript, but Volkov escapes.';
            } else if (riddlesSolved >= totalRiddles / 2) {
                title = 'A Lead, Not a Victory';
                description = 'You gather enough evidence to close Elena\'s case, but the Babel Society remains.';
            } else {
                title = 'Case Closed';
                description = 'You solved the case, but Volkov escaped with the manuscript.';
            }
            
            const html = `
                <div class="passage ending">
                    <h1>${title}</h1>
                    <p>${description}</p>
                    <div class="stats">
                        <p><strong>Riddles solved:</strong> ${riddlesSolved} of ${totalRiddles}</p>
                        <p><strong>Items collected:</strong> ${itemsCollected} of ${allItems}</p>
                        <p><strong>Sanity remaining:</strong> ${gameState.sanity}</p>
                        <p><strong>Final score:</strong> ${gameState.score}</p>
                    </div>
                    <p><em>All our words are connected.</em></p>
                    <p class="nav"><a href="#" onclick="resetGame(); return false;">New Case</a></p>
                </div>
            `;
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
        }

        function resetGame() {
            clearScreen();
            gameState = {
                visitedLocations: [],
                solvedRiddles: [],
                inventory: [],
                sanity: 3,
                maxSanity: 3,
                score: 0,
                currentLocationId: null,
                currentRiddleId: null
            };
            currentRiddle = null;
            currentLocation = null;
            
            localStorage.removeItem('babelConspiracyAutoSave');
            
            document.getElementById('loading').hidden = false;
            document.getElementById('loading').innerHTML = '<p>Starting new case... <span id="dots"></span></p>';
            initGame();
        }

        // ============================================================
        // UTILITIES
        // ============================================================
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // Animated loading dots
        const dots = ['', '.', '..', '...'];
        let dotIndex = 0;
        setInterval(() => {
            dotIndex = (dotIndex + 1) % dots.length;
            const dotsEl = document.getElementById('dots');
            if (dotsEl) dotsEl.textContent = dots[dotIndex];
        }, 500);
    </script>
</body>
</html>
