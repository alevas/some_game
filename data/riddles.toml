# =============================================================================
# NOIR LANGUAGE RIDDLES: THE RIDDLES
# =============================================================================
#
# Every riddle in the game, grouped by the place where it is asked. The story
# (places, people, what they say) is in story.toml. The game checks both files
# when it starts; if something is wrong it stops and says which file, which
# riddle and what the problem is.
#
# Lines starting with # are comments: the game ignores them.
#
# -----------------------------------------------------------------------------
# A RIDDLE
# -----------------------------------------------------------------------------
# Each riddle starts with a [[riddle]] line, followed by its fields:
#
#   id            A number, different for every riddle (Volkov's included).
#                 Saved games and the etymology notebook refer to riddles by
#                 it, so don't renumber existing riddles; give new ones new
#                 numbers.
#   location      Where it is asked: "ClientOffice", "Library", "Cafe",
#                 "Church" or "Archive" (the ids in story.toml). Within a
#                 location, riddles are asked in the order of this file.
#   kind          How it is answered. Leave it out for "choice".
#                   "choice"  pick one of the options with the number keys
#                   "type"    type the word
#                   "match"   pair up words by typing letters
#   language      Shown above the riddle. The notebook groups entries by it.
#   category      Shown above the riddle, e.g. "etymology", "false friends".
#   difficulty    1, 2 or 3 (leave it out for 1). Worth 10 points per level.
#   clue          The word or words under investigation, shown as "Clue: ...".
#                 The notebook lists it next to the answer.
#   text          The question.
#   hint          Shown after a wrong answer, or in exchange for evidence.
#   explanation   Shown once the riddle is solved, and kept in the notebook.
#   item          Optional. The evidence won by solving it on the first try.
#                 Each piece of evidence comes from one riddle only.
#   item_help     Optional. Extra help shown while you hold some evidence:
#                   item_help = { evidence = "Cipher Wheel", text = "..." }
#
# Choice riddles also have:
#   answer         The right option.
#   wrong_answers  1 to 3 wrong options, shown together with the answer.
#   decoys         Exactly 2 more wrong options. After a wrong pick, the option
#                  picked is swapped for a decoy and the options reshuffle, so
#                  guessing through doesn't work.
#                  Every wrong option must be clearly wrong, and none may
#                  repeat the answer.
#
# Type riddles also have:
#   answer         The word to type.
#   accepted       Optional. Other spellings that count too, e.g. ["feet"].
#                  Capitals, spaces and punctuation are ignored.
#
# Match riddles have, instead of an answer:
#   pairs          The right pairs, left-hand word first. The game shuffles
#                  the right-hand words and the player types their letters.
#                    pairs = [
#                        ["Rat", "advice"],
#                        ["Chef", "boss"],
#                    ]
#
# Volkov's riddles for the final showdown are written [[volkov_riddle]], at the
# end of this file. They have the same fields, except that they have no
# location and the hint is optional (the showdown has no hints).
#
# -----------------------------------------------------------------------------
# WRITING TEXT
# -----------------------------------------------------------------------------
# Text goes in "double quotes". If the text itself contains double quotes, put
# 'single quotes' around it instead. Long text can go inside triple quotes,
# over several lines; the game joins the lines with single spaces:
#
#   explanation = """
#   First sentence.
#   Second sentence.
#   """
#
# Inside "double" or """triple""" quotes a backslash (\) starts a special
# character, so avoid backslashes there.

