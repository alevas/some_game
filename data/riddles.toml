language = "French"
category = "etymology"
clue = "cuevrefeu"
text = """
"We move after curfew," reads a note in Volkov's hand. The word is Old French cuevrefeu.
What does it say, word for word?
"""
answer = "Cover the fire"
wrong_answers = ["Close the gates", "Ring the bells"]
decoys = ["Light the lamps", "Feed the horses"]
hint = "Feu is fire."
explanation = """
Old French cuevrefeu is 'cover fire': an evening bell told people to cover or put out their
hearths, so that nothing would catch fire in the night.
"""
item = "Night Pass"

