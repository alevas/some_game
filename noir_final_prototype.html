<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noir Language Riddles: The Babel Conspiracy</title>
    <style>
        body {
            background-color: black;
            color: #e0e0e0;
            font-family: "Courier New", monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
            line-height: 1.7;
        }
        @media (min-width: 768px) {
            body {
                padding: 20px;
            }
        }
        h1 {
            font-size: 24px;
            border-bottom: 2px solid #444;
            padding-bottom: 15px;
            letter-spacing: 1px;
        }
        @media (min-width: 768px) {
            h1 {
                font-size: 28px;
            }
        }
        h2 {
            font-size: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-top: 30px;
        }
        @media (min-width: 768px) {
            h2 {
                font-size: 22px;
            }
        }
        .passage {
            margin-bottom: 20px;
            padding-bottom: 15px;
        }
        a {
            color: #999;
            text-decoration: none;
            border: 1px solid #555;
            padding: 5px 10px;
            margin: 2px;
            font-size: 14px;
            display: inline-block;
            min-width: 44px;
            min-height: 44px;
            line-height: 34px;
            text-align: center;
        }
        @media (min-width: 768px) {
            a {
                padding: 3px 8px;
                font-size: 14px;
                min-width: 0;
                min-height: 0;
                line-height: normal;
            }
        }
        a:hover {
            background-color: #333;
            color: #fff;
        }
        .dialogue {
            font-style: italic;
            color: #bbb;
            margin: 10px 0;
        }
        .clue {
            font-family: "Courier New", monospace;
            background-color: #111;
            padding: 8px 12px;
            border-left: 3px solid #555;
            margin: 10px 0;
            font-size: 16px;
            white-space: pre-wrap;
        }
        .cyrillic {
            font-family: "Courier New", monospace;
            font-size: 18px;
        }
        .location {
            font-weight: bold;
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .wrong {
            color: #e74c3c;
            font-style: italic;
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .correct {
            color: #4CAF50;
        }
        .hint {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        #loading {
            color: #666;
            font-style: italic;
        }
        .nav {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        #game-ui {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 10px;
            border-top: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            z-index: 100;
        }
        @media (min-width: 768px) {
            #game-ui {
                padding: 15px 20px;
            }
        }
        #sanity-meter {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        @media (min-width: 768px) {
            #sanity-meter {
                gap: 10px;
                margin-bottom: 0;
            }
        }
        .sanity-full { color: #e74c3c; }
        .sanity-low { color: #c0392b; }
        .sanity-critical { color: #922b21; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #inventory {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-width: 60%;
            order: 3;
            width: 100%;
        }
        @media (min-width: 768px) {
            #inventory {
                max-width: 50%;
                order: 2;
            }
        }
        .item {
            background: #1a1a1a;
            border: 1px solid #555;
            padding: 2px 6px;
            font-size: 12px;
            border-radius: 3px;
            cursor: default;
        }
        .item:hover {
            background: #2a2a2a;
            border-color: #777;
        }
        #inventory-label {
            font-size: 12px;
            color: #888;
            margin-right: 10px;
        }
        .game-over, .ending {
            text-align: center;
            padding: 30px 15px;
        }
        @media (min-width: 768px) {
            .game-over, .ending {
                padding: 40px 20px;
            }
        }
        .game-over h1 {
            color: #e74c3c;
        }
        .ending h1 {
            color: #4CAF50;
        }
        .stats {
            background: #111;
            padding: 15px;
            border: 1px solid #444;
            margin: 20px 0;
            text-align: left;
        }
        #save-menu {
            background: rgba(0,0,0,0.95);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 200;
            display: none;
            padding: 20px;
        }
        #save-menu.visible {
            display: block;
        }
        .save-slot {
            background: #111;
            border: 1px solid #444;
            padding: 10px;
            margin: 10px 0;
        }
        .save-slot button {
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Save Menu -->
    <div id="save-menu">
        <h2>Save/Load Game</h2>
        <div class="save-slot" id="slot1">
            <strong>Slot 1</strong>
            <div id="slot1-info">Empty</div>
            <button onclick="saveGame(1)">Save</button>
            <button onclick="loadGame(1)">Load</button>
        </div>
        <div class="save-slot" id="slot2">
            <strong>Slot 2</strong>
            <div id="slot2-info">Empty</div>
            <button onclick="saveGame(2)">Save</button>
            <button onclick="loadGame(2)">Load</button>
        </div>
        <div class="save-slot" id="slot3">
            <strong>Slot 3</strong>
            <div id="slot3-info">Empty</div>
            <button onclick="saveGame(3)">Save</button>
            <button onclick="loadGame(3)">Load</button>
        </div>
        <button onclick="toggleSaveMenu()" style="margin-top: 20px;">Close</button>
    </div>

    <!-- Game UI (fixed at bottom) -->
    <div id="game-ui">
        <div id="sanity-meter">
            <span>SANITY: </span>
            <span id="sanity-icons"></span>
        </div>
        <div id="score-display">SCORE: <span id="score">0</span></div>
        <div>
            <span id="inventory-label">INVENTORY:</span>
            <div id="inventory"></div>
        </div>
        <div>
            <button onclick="toggleSaveMenu()" style="background: #333; color: #ccc; border: 1px solid #555; padding: 3px 8px; cursor: pointer;">Menu</button>
        </div>
    </div>

    <div id="loading" class="passage">
        <p>Loading case files... <span id="dots"></span></p>
    </div>

    <script>
        // Global state
        let db = null;
        let currentRiddle = null;
        let currentLocation = null;
        let gameState = {
            visitedLocations: [],
            solvedRiddles: [],
            inventory: [],
            sanity: 3,
            score: 0,
            maxSanity: 3
        };
        let autoSaveEnabled = true;

        // Animated dots for loading
        const dots = ['', '.', '..', '...'];
        let dotIndex = 0;
        const dotsElement = document.getElementById('dots');
        
        setInterval(() => {
            dotIndex = (dotIndex + 1) % dots.length;
            if (dotsElement) {
                dotsElement.textContent = dots[dotIndex];
            }
        }, 500);

        // Load the database
        async function loadDB() {
            try {
                const response = await fetch('riddles_db.json');
                if (!response.ok) {
                    throw new Error('Database not found');
                }
                db = await response.json();
                loadSavedGame();
                startGame();
            } catch (error) {
                console.error('Error loading database:', error);
                loadFallback();
            }
        }

        function loadFallback() {
            db = {
                riddles: [],
                locations: [],
                characters: []
            };
            startGame();
        }

        function loadSavedGame() {
            const saved = localStorage.getItem('babelConspiracyAutoSave');
            if (saved) {
                try {
                    const savedState = JSON.parse(saved);
                    gameState = { ...gameState, ...savedState };
                    console.log('Loaded auto-saved game');
                } catch (e) {
                    console.error('Error loading save:', e);
                }
            }
            updateSaveSlots();
        }

        function startGame() {
            document.getElementById('loading').hidden = true;
            updateUI();
            
            const startLoc = db.locations.find(l => l.id === "ClientOffice");
            if (startLoc) {
                showLocation(startLoc);
            } else if (db.riddles.length > 0) {
                showRiddle(db.riddles[0]);
            } else {
                document.getElementById('loading').innerHTML = '<p>No riddles found. Please add riddles to riddles_db.json</p>';
            }
        }

        function updateSaveSlots() {
            for (let i = 1; i <= 3; i++) {
                const saved = localStorage.getItem(`babelConspiracySave${i}`);
                const infoEl = document.getElementById(`slot${i}-info`);
                if (saved) {
                    try {
                        const state = JSON.parse(saved);
                        infoEl.textContent = `Score: ${state.score}, Sanity: ${state.sanity}, Riddles: ${state.solvedRiddles.length}`;
                    } catch (e) {
                        infoEl.textContent = 'Corrupted';
                    }
                } else {
                    infoEl.textContent = 'Empty';
                }
            }
        }

        function toggleSaveMenu() {
            const menu = document.getElementById('save-menu');
            menu.classList.toggle('visible');
            updateSaveSlots();
        }

        function saveGame(slot) {
            localStorage.setItem(`babelConspiracySave${slot}`, JSON.stringify(gameState));
            if (autoSaveEnabled) {
                localStorage.setItem('babelConspiracyAutoSave', JSON.stringify(gameState));
            }
            updateSaveSlots();
            toggleSaveMenu();
        }

        function loadGame(slot) {
            const saved = localStorage.getItem(`babelConspiracySave${slot}`);
            if (saved) {
                try {
                    gameState = JSON.parse(saved);
                    restartGame();
                    toggleSaveMenu();
                } catch (e) {
                    console.error('Error loading save:', e);
                }
            }
        }

        // Update UI
        function updateUI() {
            // Sanity meter
            const sanityIcons = document.getElementById('sanity-icons');
            if (sanityIcons) {
                let icons = '';
                for (let i = 0; i < gameState.maxSanity; i++) {
                    if (i < gameState.sanity) {
                        icons += '♥';
                    } else {
                        icons += '♡';
                    }
                }
                sanityIcons.innerHTML = icons;
                sanityIcons.className = gameState.sanity > 1 ? 'sanity-full' : 
                                           gameState.sanity > 0 ? 'sanity-low' : 'sanity-critical';
            }
            
            // Score
            const scoreEl = document.getElementById('score');
            if (scoreEl) {
                scoreEl.textContent = gameState.score;
            }
            
            // Inventory
            const inventoryEl = document.getElementById('inventory');
            if (inventoryEl) {
                inventoryEl.innerHTML = '';
                gameState.inventory.forEach(item => {
                    const itemEl = document.createElement('span');
                    itemEl.className = 'item';
                    itemEl.textContent = item;
                    inventoryEl.appendChild(itemEl);
                });
            }
            
            // Auto-save
            if (autoSaveEnabled) {
                localStorage.setItem('babelConspiracyAutoSave', JSON.stringify(gameState));
            }
            
            // Check for game over
            if (gameState.sanity <= 0) {
                showGameOver();
            }
        }

        function showLocation(location) {
            currentLocation = location;
            if (!gameState.visitedLocations.includes(location.id)) {
                gameState.visitedLocations.push(location.id);
            }
            
            let html = `
                <div class="passage">
                    <div class="location">:: ${location.name.toUpperCase()} ::</div>
                    <p>${location.description}</p>
            `;

            // Add character dialogue
            const character = findCharacterForLocation(location.id);
            if (character) {
                html += `<p class="dialogue">"${character.dialogue[0]}"</p>`;
            }

            // Find the riddle for this location
            const riddleId = location.riddle_id || location.first_riddle_id;
            const riddle = db.riddles.find(r => r.id === riddleId);
            
            if (riddle) {
                currentRiddle = riddle;
                html += `
                    <div class="clue">${riddle.clue}</div>
                    <p><em>${riddle.text}</em></p>
                    <p>
                `;
                
                // Show answer options
                const allAnswers = [riddle.answer, ...riddle.wrong_answers];
                const shuffled = shuffleArray(allAnswers);
                
                shuffled.forEach(ans => {
                    const escaped = ans.replace(/'/g, "&#39;");
                    html += `<a href="#" onclick="checkAnswer('${escaped}'); return false;">${ans}</a> `;
                });
                
                html += `
                    </p>
                    <div id="hint-container" style="display:none;">
                        <p class="hint">Hint: ${riddle.hint || 'Think carefully...'}</p>
                        <a href="#" onclick="showHint(); return false;" id="show-hint-btn">Show hint</a>
                    </div>
                `;
            }
            
            html += `</div>`;
            
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
            updateUI();
        }

        function showRiddle(riddle) {
            currentRiddle = riddle;
            
            let html = `
                <div class="passage">
                    <h2>Riddle: ${riddle.language}</h2>
                    <div class="clue">${riddle.clue}</div>
                    <p><em>${riddle.text}</em></p>
                    <p>
            `;
            
            const allAnswers = [riddle.answer, ...riddle.wrong_answers];
            const shuffled = shuffleArray(allAnswers);
            
            shuffled.forEach(ans => {
                const escaped = ans.replace(/'/g, "&#39;");
                html += `<a href="#" onclick="checkAnswer('${escaped}'); return false;">${ans}</a> `;
            });
            
            html += `
                    </p>
                    <div id="hint-container" style="display:none;">
                        <p class="hint">Hint: ${riddle.hint || 'Think carefully...'}</p>
                    </div>
                </div>
            `;
            
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
            updateUI();
        }

        function checkAnswer(selected) {
            const correct = selected === currentRiddle.answer;
            
            // Remove all passage content except the current one
            const passages = document.querySelectorAll('.passage');
            passages.forEach((p, index) => {
                if (index < passages.length - 1) {
                    p.remove();
                }
            });
            
            const lastPassage = document.querySelector('.passage');
            
            if (correct) {
                if (!gameState.solvedRiddles.includes(currentRiddle.id)) {
                    gameState.solvedRiddles.push(currentRiddle.id);
                }
                gameState.score += currentRiddle.difficulty * 10;
                
                // Add item to inventory if it exists
                if (currentRiddle.item && !gameState.inventory.includes(currentRiddle.item)) {
                    gameState.inventory.push(currentRiddle.item);
                }
                
                updateUI();
                
                let html = `
                    <p class="correct">✓ Correct!</p>
                    <p><strong>${currentRiddle.answer}</strong></p>
                    <p>${currentRiddle.explanation}</p>
                `;
                
                // Show collected item
                if (currentRiddle.item) {
                    html += `<p class="correct">You collected: <strong>${currentRiddle.item}</strong></p>`;
                }
                
                // Progress to next location
                if (currentRiddle.next_location) {
                    const nextLoc = db.locations.find(l => l.id === currentRiddle.next_location);
                    if (nextLoc) {
                        html += `<p><a href="#" onclick="showLocation(db.locations.find(l => l.id === '${currentRiddle.next_location}')); return false;">Continue to ${nextLoc.name}</a></p>`;
                    } else {
                        html += `<p><a href="#" onclick="showRandomRiddle(); return false;">Continue investigating</a></p>`;
                    }
                } else {
                    html += `<p><a href="#" onclick="showRandomRiddle(); return false;">Next riddle</a></p>`;
                }
                
                lastPassage.innerHTML += html;
            } else {
                gameState.sanity -= 1;
                updateUI();
                
                let html = `
                    <p class="wrong">✗ Wrong.</p>
                    <p><em>${selected}</em> is not the answer.</p>
                    <p><strong>You lose 1 Sanity point!</strong></p>
                    <p>
                        <a href="#" onclick="retryRiddle(); return false;">Try again</a>
                        <a href="#" onclick="showHint(); return false;" id="show-hint-btn">Show hint</a>
                    </p>
                `;
                lastPassage.innerHTML += html;
            }
        }

        function retryRiddle() {
            const passages = document.querySelectorAll('.passage');
            passages.forEach(p => p.remove());
            if (currentLocation) {
                showLocation(currentLocation);
            } else {
                showRiddle(currentRiddle);
            }
        }

        function showHint() {
            const hintContainer = document.getElementById('hint-container');
            if (hintContainer) {
                hintContainer.style.display = 'block';
            }
            const btn = document.getElementById('show-hint-btn');
            if (btn) btn.remove();
        }

        function showRandomRiddle() {
            const unsolved = db.riddles.filter(r => !gameState.solvedRiddles.includes(r.id));
            if (unsolved.length > 0) {
                const randomRiddle = unsolved[Math.floor(Math.random() * unsolved.length)];
                const passages = document.querySelectorAll('.passage');
                passages.forEach(p => p.remove());
                showRiddle(randomRiddle);
            } else {
                showEnding();
            }
        }

        function showGameOver() {
            const passages = document.querySelectorAll('.passage');
            passages.forEach(p => p.remove());
            
            const html = `
                <div class="passage game-over">
                    <h1>GAME OVER</h1>
                    <p>Volkov's men found you first.</p>
                    <div class="stats">
                        <p><strong>Riddles solved:</strong> ${gameState.solvedRiddles.length} of ${db.riddles.length}</p>
                        <p><strong>Items collected:</strong> ${gameState.inventory.length}</p>
                        <p><strong>Final score:</strong> ${gameState.score}</p>
                    </div>
                    <p>The Babel Society wins. For now.</p>
                    <p class="nav"><a href="#" onclick="restartGame(); return false;">Retry Case</a></p>
                </div>
            `;
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
        }

        function showEnding() {
            const passages = document.querySelectorAll('.passage');
            passages.forEach(p => p.remove());
            
            // Determine which ending
            const allRiddlesSolved = gameState.solvedRiddles.length >= db.riddles.length;
            const allItemsCollected = gameState.inventory.length >= db.riddles.filter(r => r.item).length;
            const highScore = gameState.score >= 200;
            
            let title = 'Case Closed';
            let description = 'You solved the case, but Volkov escaped with the manuscript.';
            
            if (allRiddlesSolved && allItemsCollected) {
                title = 'The Truth Revealed';
                description = 'With all clues and the complete Babel Manuscript, you expose the Babel Society to the world.';
            } else if (allRiddlesSolved || highScore) {
                title = 'Partial Victory';
                description = 'You solve the case and recover the manuscript, but Volkov escapes.';
            } else if (gameState.solvedRiddles.length >= db.riddles.length / 2) {
                title = 'A Lead, Not a Victory';
                description = 'You gather enough evidence to close Elena\'s case, but the Babel Society remains.';
            }
            
            const html = `
                <div class="passage ending">
                    <h1>${title}</h1>
                    <p>${description}</p>
                    <div class="stats">
                        <p><strong>Riddles solved:</strong> ${gameState.solvedRiddles.length} of ${db.riddles.length}</p>
                        <p><strong>Items collected:</strong> ${gameState.inventory.length} of ${db.riddles.filter(r => r.item).length}</p>
                        <p><strong>Sanity remaining:</strong> ${gameState.sanity}</p>
                        <p><strong>Final score:</strong> ${gameState.score}</p>
                    </div>
                    <p><em>All our words are connected.</em></p>
                    <p class="nav"><a href="#" onclick="restartGame(); return false;">New Case</a></p>
                </div>
            `;
            document.getElementById('loading').insertAdjacentHTML('afterend', html);
            document.getElementById('loading').hidden = true;
        }

        function restartGame() {
            const passages = document.querySelectorAll('.passage');
            passages.forEach(p => p.remove());
            
            gameState = {
                visitedLocations: [],
                solvedRiddles: [],
                inventory: [],
                sanity: 3,
                score: 0,
                maxSanity: 3
            };
            currentRiddle = null;
            currentLocation = null;
            
            document.getElementById('loading').hidden = false;
            document.getElementById('loading').innerHTML = '<p>Restarting case... <span id="dots"></span>';
            loadDB();
        }

        function findCharacterForLocation(locId) {
            const locationMap = {
                "ClientOffice": "Weber",
                "Library": "Librarian",
                "Cafe": "Waiter",
                "Church": "Sacristan",
                "Archive": "Volkov"
            };
            const charId = locationMap[locId];
            return db.characters.find(c => c.id === charId);
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // Load the database when the page loads
        loadDB();
    </script>
</body>
</html>
