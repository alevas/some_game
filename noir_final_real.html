<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noir Language Riddles: The Babel Conspiracy</title>
    <style>
        body {
            background-color: black;
            color: #e0e0e0;
            font-family: "Courier New", monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
            line-height: 1.7;
        }
        @media (min-width: 768px) {
            body { padding: 20px; }
        }
        h1 { font-size: 24px; border-bottom: 2px solid #444; padding-bottom: 15px; letter-spacing: 1px; }
        @media (min-width: 768px) { h1 { font-size: 28px; } }
        h2 { font-size: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; margin-top: 30px; }
        @media (min-width: 768px) { h2 { font-size: 22px; } }
        .passage { margin-bottom: 20px; padding-bottom: 15px; }
        a {
            color: #999;
            text-decoration: none;
            border: 1px solid #555;
            padding: 5px 10px;
            margin: 2px;
            font-size: 14px;
            display: inline-block;
            min-width: 44px;
            min-height: 44px;
            line-height: 34px;
            text-align: center;
        }
        @media (min-width: 768px) {
            a { padding: 3px 8px; font-size: 14px; min-width: 0; min-height: 0; line-height: normal; }
        }
        a:hover { background-color: #333; color: #fff; }
        .dialogue { font-style: italic; color: #bbb; margin: 10px 0; }
        .clue { font-family: "Courier New", monospace; background-color: #111; padding: 8px 12px; border-left: 3px solid #555; margin: 10px 0; font-size: 16px; white-space: pre-wrap; }
        .location { font-weight: bold; color: #aaa; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .wrong { color: #e74c3c; font-style: italic; animation: shake 0.5s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
        .correct { color: #4CAF50; }
        .hint { color: #888; font-size: 14px; margin-top: 10px; }
        #loading { color: #666; font-style: italic; }
        .nav { margin-top: 20px; padding-top: 15px; border-top: 1px solid #333; }
        #game-ui {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 10px;
            border-top: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            z-index: 100;
        }
        @media (min-width: 768px) { #game-ui { padding: 15px 20px; } }
        #sanity-meter { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        @media (min-width: 768px) { #sanity-meter { gap: 10px; margin-bottom: 0; } }
        .sanity-full { color: #e74c3c; }
        .sanity-low { color: #c0392b; }
        .sanity-critical { color: #922b21; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        #inventory { display: flex; gap: 8px; flex-wrap: wrap; max-width: 60%; order: 3; width: 100%; }
        @media (min-width: 768px) { #inventory { max-width: 50%; order: 2; } }
        .item { background: #1a1a1a; border: 1px solid #555; padding: 2px 6px; font-size: 12px; border-radius: 3px; cursor: default; }
        .item:hover { background: #2a2a2a; border-color: #777; }
        #inventory-label { font-size: 12px; color: #888; margin-right: 10px; }
        .game-over, .ending { text-align: center; padding: 30px 15px; }
        @media (min-width: 768px) { .game-over, .ending { padding: 40px 20px; } }
        .game-over h1 { color: #e74c3c; }
        .ending h1 { color: #4CAF50; }
        .stats { background: #111; padding: 15px; border: 1px solid #444; margin: 20px 0; text-align: left; }
        #save-menu {
            background: rgba(0,0,0,0.95);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 200;
            display: none;
            padding: 20px;
        }
        #save-menu.visible { display: block; }
        .save-slot { background: #111; border: 1px solid #444; padding: 10px; margin: 10px 0; }
        .save-slot button { background: #333; color: #ccc; border: 1px solid #555; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="save-menu">
        <h2>Save/Load Game</h2>
        <div class="save-slot" id="slot1"><strong>Slot 1</strong><div id="slot1-info">Empty</div>
            <button onclick="saveToSlot(1)">Save</button><button onclick="loadFromSlot(1)">Load</button></div>
        <div class="save-slot" id="slot2"><strong>Slot 2</strong><div id="slot2-info">Empty</div>
            <button onclick="saveToSlot(2)">Save</button><button onclick="loadFromSlot(2)">Load</button></div>
        <div class="save-slot" id="slot3"><strong>Slot 3</strong><div id="slot3-info">Empty</div>
            <button onclick="saveToSlot(3)">Save</button><button onclick="loadFromSlot(3)">Load</button></div>
        <button onclick="toggleSaveMenu()" style="margin-top: 20px;">Close</button>
    </div>

    <div id="game-ui">
        <div id="sanity-meter"><span>SANITY: </span><span id="sanity-icons"></span></div>
        <div id="score-display">SCORE: <span id="score">0</span></div>
        <div><span id="inventory-label">INVENTORY:</span><div id="inventory"></div></div>
        <div><button onclick="toggleSaveMenu()" style="background: #333; color: #ccc; border: 1px solid #555; padding: 3px 8px; cursor: pointer;">Menu</button></div>
    </div>

    <div id="loading" class="passage"><p>Loading case files... <span id="dots"></span></p></div>

    <script>
        // ===== DATABASE =====
        const R = [
            {id:1, lang:"Greek", text:"In Greek it is βιβλίο (vivlio). Where do these live?", clue:"βιβλίο", answer:"Library", wrong:["University","Bookstore"], hint:"Think where books are collected.", explain:"From Greek βιβλιον (biblion) = book.", next:"Library", item:"Case File", diff:1},
            {id:2, lang:"German", text:"In German, linguists met where Kaffee flows. Where?", clue:"Linguisten trafen sich, wo Kaffee fließt", answer:"Café Mozart", wrong:["The university","A beer hall"], hint:"Not a pub. Somewhere with coffee.", explain:"Kaffee = coffee. Berlin intellectuals met in cafes.", next:"Cafe", item:"Sugar Packet", diff:1},
            {id:3, lang:"Spanish", text:"This word is libro in Spanish, livre in French, Buch in German. What is it in English?", clue:"libro | livre | Buch", answer:"Book", wrong:["Library","Novel"], hint:"All mean the same thing.", explain:"All from Latin liber.", next:"Cafe", item:"Dictionary", diff:1},
            {id:4, lang:"Russian", text:"This Slavic word is передача meaning transmission. What English word shares Latin root trahere?", clue:"передача", answer:"Tradition", wrong:["Transfer","Translation"], hint:"Passing down through generations.", explain:"From Latin tradere = to hand over.", next:"Archive", item:"Cipher Wheel", diff:2},
            {id:5, lang:"Arvanitika", text:"In Arvanitika, it is buke. In Greek, it is ψωμί. What is it in English?", clue:"buke | ψωμί", answer:"Bread", wrong:["Book","Brick"], hint:"It is a staple food.", explain:"Shows Albanian-Greek connection.", next:"Cafe", item:"Arvanitika Notes", diff:2},
            {id:6, lang:"Greek", text:"In Greek, it is πατήρ (pater). In German, it is Vater. What is it in English?", clue:"πατήρ | Vater", answer:"Father", wrong:["Mother","Brother"], hint:"PIE root: *pəter", explain:"All from Proto-Indo-European.", next:"Church", item:null, diff:1},
            {id:7, lang:"German", text:"In German, Gift does not mean a present. What does it mean?", clue:"Gift", answer:"Poison", wrong:["Gift","Present"], hint:"In English, gift is positive.", explain:"German Gift = poison. Classic false friend.", next:"Cafe", item:null, diff:1},
            {id:8, lang:"English", text:"This word is mother in English, Mutter in German, μητέρα in Greek. What is it?", clue:"mother | Mutter | μητέρα", answer:"Mother", wrong:["Sister","Aunt"], hint:"PIE root: *méh₂tēr", explain:"Preserved across 4000+ years.", next:"Church", item:"Family Tree", diff:1},
            {id:9, lang:"Spanish", text:"This word is noche in Spanish. In Latin it was nox. What is it in English?", clue:"noche | nox", answer:"Night", wrong:["Noon","Noxious"], hint:"Opposite of day.", explain:"From Latin nox/noctis.", next:"Library", item:null, diff:1},
            {id:10, lang:"Russian", text:"This Russian word is водка (vodka). From вода (voda) meaning water. What is the connection?", clue:"водка | вода", answer:"Little water", wrong:["Fire water","Strong drink"], hint:"Vodka is a diminutive.", explain:"Diminutive of вода (water).", next:"Cafe", item:"Vodka Bottle", diff:2}
        ];
        const L = {
            ClientOffice: {id:"ClientOffice", name:"Weber's Office", desc:"Berlin, 1947. A desk lamp illuminates case files. A note in Greek catches your eye. Elena Weber has disappeared.", riddle:1},
            Library: {id:"Library", name:"Staatsbibliothek", desc:"Tall shelves stretch into shadow. Ancient manuscripts in Greek, German, Latin. A librarian eyes you suspiciously.", riddle:3},
            Cafe: {id:"Cafe", name:"Café Mozart", desc:"The scent of coffee and sugar. Intellectuals and spies share tables. A waiter polishes a glass, watching.", riddle:2},
            Church: {id:"Church", name:"St. Nicholas Church", desc:"Candlelight flickers against stone walls. Old texts in Greek and Latin. The Babel Society has left its mark here.", riddle:6},
            Archive: {id:"Archive", name:"Secret Archive", desc:"Files upon files of linguistic research. Volkov has been one step ahead. The final pieces are within reach.", riddle:4}
        };
        const C = {ClientOffice:"Weber", Library:"Librarian", Cafe:"Waiter", Church:"Sacristan", Archive:"Volkov"};
        const D = {Weber:["I need your help. The Babel Society is real."], Librarian:["She was here last week asking about PIE."], Waiter:["The men in suits come in every Tuesday."], Sacristan:["The church has secrets older than the building."], Volkov:["You're too late. The work is already done."]};

        // ===== STATE =====
        let S = {loc:"ClientOffice", solved:[], inv:[], sanity:3, maxSanity:3, score:0};

        // ===== INIT =====
        function loadSaved() {
            const s = localStorage.getItem("babelSave");
            if (s) {
                try { S = JSON.parse(s); } catch(e) {}
            }
            updateUI();
        }
        function toggleSaveMenu() {
            const m = document.getElementById("save-menu");
            m.classList.toggle("visible");
            for(let i=1;i<=3;i++) {
                const d = document.getElementById("slot"+i+"-info");
                const s = localStorage.getItem("babelSave"+i);
                d.textContent = s ? "Score:"+JSON.parse(s).score+", Sanity:"+JSON.parse(s).sanity : "Empty";
            }
        }
        function saveToSlot(n) {
            localStorage.setItem("babelSave"+n, JSON.stringify(S));
            localStorage.setItem("babelSave", JSON.stringify(S));
            toggleSaveMenu();
        }
        function loadFromSlot(n) {
            const s = localStorage.getItem("babelSave"+n);
            if (s) {
                S = JSON.parse(s);
                clear();
                showLocation(S.loc);
                toggleSaveMenu();
            }
        }
        function clear() {
            const ps = document.querySelectorAll(".passage");
            ps.forEach(p => p.remove());
        }
        function updateUI() {
            localStorage.setItem("babelSave", JSON.stringify(S));
            // Sanity
            let icons = "";
            for(let i=0;i<S.maxSanity;i++) icons += (i<S.sanity)?"♥":"♡";
            document.getElementById("sanity-icons").innerHTML = icons;
            document.getElementById("sanity-icons").className = S.sanity>1?"sanity-full":S.sanity>0?"sanity-low":"sanity-critical";
            // Score
            document.getElementById("score").textContent = S.score;
            // Inventory
            const inv = document.getElementById("inventory");
            inv.innerHTML = "";
            S.inv.forEach(i => {const sp=document.createElement("span");sp.className="item";sp.textContent=i;inv.appendChild(sp);});
            // Game over
            if(S.sanity<=0) showGameOver();
        }

        // ===== LOCATIONS =====
        function showLocation(locId) {
            S.loc = locId;
            const loc = L[locId];
            if(!S.visited) S.visited=[];
            if(!S.visited.includes(locId)) S.visited.push(locId);
            
            let html = `<div class="passage"><div class="location">:: ${loc.name.toUpperCase()} ::</div><p>${loc.desc}</p>`;
            
            // Character dialogue
            const charId = C[locId];
            const dialogue = D[charId] ? D[charId][0] : "";
            if(dialogue) html += `<p class="dialogue">"${dialogue}"</p>`;
            
            // Find unsolved riddle for this location
            const rid = loc.riddle;
            const riddle = R.find(r => r.id === rid && !S.solved.includes(r.id));
            
            if(riddle) {
                html += renderRiddle(riddle);
            } else {
                html += `<p>You've solved all riddles here.</p><p><a href="#" onclick="showRandom(); return false;">Look for more clues</a></p>`;
            }
            
            html += `</div>`;
            document.getElementById("loading").insertAdjacentHTML("afterend", html);
            document.getElementById("loading").hidden = true;
            updateUI();
        }

        function renderRiddle(r) {
            const all = [r.answer, ...r.wrong];
            const shuffled = shuffle([...all]);
            let html = `<div class="clue">${r.clue}</div><p><em>${r.text}</em></p><p>`;
            shuffled.forEach(a => {
                const esc = a.replace(/'/g, "&#39;");
                html += `<a href="#" onclick="checkAnswer('${r.id}','${esc}','${r.next}'); return false;">${a}</a> `;
            });
            html += `</p><div id="hint" style="display:none;"><p class="hint">Hint: ${r.hint}</p></div>`;
            return html;
        }

        // ===== ANSWERS =====
        function checkAnswer(rid, selected, nextLoc) {
            const r = R.find(x => x.id == rid);
            const last = document.querySelector(".passage");
            if(!last) return;
            
            if(selected === r.answer) {
                if(!S.solved.includes(r.id)) S.solved.push(r.id);
                S.score += r.diff * 10;
                if(r.item && !S.inv.includes(r.item)) S.inv.push(r.item);
                updateUI();
                
                let html = `<p class="correct">✓ Correct!</p><p><strong>${r.answer}</strong></p><p>${r.explain}</p>`;
                if(r.item) html += `<p class="correct">You collected: <strong>${r.item}</strong></p>`;
                if(nextLoc) {
                    html += `<p><a href="#" onclick="showLocation('${nextLoc}'); return false;">Continue to ${L[nextLoc].name}</a></p>`;
                } else {
                    html += `<p><a href="#" onclick="showRandom(); return false;">Next riddle</a></p>`;
                }
                last.innerHTML += html;
            } else {
                S.sanity--;
                updateUI();
                let html = `<p class="wrong">✗ Wrong.</p><p><em>${selected}</em> is not the answer.</p><p><strong>You lose 1 Sanity!</strong></p><p><a href="#" onclick="retry('${S.loc}'); return false;">Try again</a> <a href="#" onclick="showHint(); return false;" id="show-hint">Show hint</a></p>`;
                last.innerHTML += html;
            }
        }

        function retry(locId) {
            clear();
            showLocation(locId);
        }
        function showHint() {
            const h = document.getElementById("hint");
            if(h) h.style.display = "block";
            const b = document.getElementById("show-hint");
            if(b) b.remove();
        }
        function showRandom() {
            clear();
            const unsolved = R.filter(r => !S.solved.includes(r.id));
            if(unsolved.length > 0) {
                showRiddle(unsolved[Math.floor(Math.random()*unsolved.length)]);
            } else {
                showEnding();
            }
        }
        function showRiddle(r) {
            clear();
            let html = `<div class="passage"><h2>Riddle: ${r.lang}</h2>${renderRiddle(r)}</div>`;
            document.getElementById("loading").insertAdjacentHTML("afterend", html);
            document.getElementById("loading").hidden = true;
            updateUI();
        }

        // ===== ENDINGS =====
        function showGameOver() {
            clear();
            const totalR = R.length;
            const totalI = R.filter(r=>r.item).length;
            const html = `<div class="passage game-over"><h1>GAME OVER</h1><p>Volkov's men found you first.</p><div class="stats"><p><strong>Riddles:</strong> ${S.solved.length} of ${totalR}</p><p><strong>Items:</strong> ${S.inv.length} of ${totalI}</p><p><strong>Score:</strong> ${S.score}</p></div><p>The Babel Society wins. For now.</p><p class="nav"><a href="#" onclick="reset(); return false;">Retry Case</a></p></div>`;
            document.getElementById("loading").insertAdjacentHTML("afterend", html);
            document.getElementById("loading").hidden = true;
        }
        function showEnding() {
            clear();
            const totalR = R.length;
            const totalI = R.filter(r=>r.item).length;
            let title, desc;
            if(S.solved.length >= totalR && S.inv.length >= totalI) {
                title = "The Truth Revealed";
                desc = "With all clues, you expose the Babel Society to the world.";
            } else if(S.solved.length >= totalR) {
                title = "Partial Victory";
                desc = "You solve the case but Volkov escapes.";
            } else if(S.solved.length >= totalR/2) {
                title = "A Lead, Not a Victory";
                desc = "You gather evidence but the Society remains.";
            } else {
                title = "Case Closed";
                desc = "You solved the case but Volkov escaped.";
            }
            const html = `<div class="passage ending"><h1>${title}</h1><p>${desc}</p><div class="stats"><p><strong>Riddles:</strong> ${S.solved.length} of ${totalR}</p><p><strong>Items:</strong> ${S.inv.length} of ${totalI}</p><p><strong>Sanity:</strong> ${S.sanity}</p><p><strong>Score:</strong> ${S.score}</p></div><p><em>All our words are connected.</em></p><p class="nav"><a href="#" onclick="reset(); return false;">New Case</a></p></div>`;
            document.getElementById("loading").insertAdjacentHTML("afterend", html);
            document.getElementById("loading").hidden = true;
        }
        function reset() {
            clear();
            S = {loc:"ClientOffice", solved:[], inv:[], sanity:3, maxSanity:3, score:0};
            document.getElementById("loading").hidden = false;
            document.getElementById("loading").innerHTML = '<p>Starting new case... <span id="dots"></span></p>';
            showLocation("ClientOffice");
        }

        // ===== UTIL =====
        function shuffle(a) { for(let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

        // ===== START =====
        loadSaved();
        showLocation("ClientOffice");

        // Loading dots
        const dots = ['','.','..','...'];
        let di = 0;
        setInterval(()=>{ di=(di+1)%dots.length; const de=document.getElementById('dots'); if(de) de.textContent=dots[di]; }, 500);
    </script>
</body>
</html>
